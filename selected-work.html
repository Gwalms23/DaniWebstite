        <li class="banner" style="--r:4.9724"><button type="button" data-type="image" data-title="Inter@ctions" data-desc="Digital Art Poster Series&#10;&#10;Inter@ctions directly contrasts the type of behavior highlighted in its sister series, Feed, by taking a moment to sit with a single post. Rather than dragging out colors, the color palette has been reduced to monochrome. Lines are more graphic and less painterly but still maintain some qualities of a hand-drawn piece. Each digital drawing was inspired by a screenshot from Instagram, incorporating identifiable iconography and visual elements from the platform. They act as frozen moments in time, authentically capturing the numbers of likes and comments from the moments my screenshots were taken. Even the frames that the prints have been placed in were chosen thoughtfully as their curved corners make each framed poster reminiscent of the screen of a smartphone. Silhouettes, limited details, and repetition of forms come together to reimagine content from these posts as unique compositions. Each artist is represented in this series by two posters inspired by posts on their popular main accounts as well as two posters inspired by posts on lesser known but still public side accounts for a total of 8 posters.&#10;" data-src="images/artwork/021-inter-ctions.jpg"><img src="images/artwork/thumbs/021-inter-ctions.jpg" alt="Inter@ctions" width="900" height="181" loading="lazy"><span class="caption">Inter@ctions<small>Digital Art Poster Series</small></span></button></li>
        <li class="feed-group"><div class="feed-side"><button type="button" data-type="image" data-title="Feed Series" data-desc="Print Transfer and Acrylic Paint on Board" data-src="images/artwork/097-feed-series.jpg"><img src="images/artwork/thumbs/097-feed-series.jpg" alt="Feed Series" width="575" height="576" loading="lazy"><span class="caption">Feed Series<small>Print Transfer and Acrylic Paint on Board</small></span></button><button type="button" data-type="image" data-title="Feed Series" data-desc="Print Transfer and Acrylic Paint on Board" data-src="images/artwork/098-feed-series.jpg"><img src="images/artwork/thumbs/098-feed-series.jpg" alt="Feed Series" width="571" height="568" loading="lazy"><span class="caption">Feed Series<small>Print Transfer and Acrylic Paint on Board</small></span></button><button type="button" data-type="image" data-title="Feed Series" data-desc="Print Transfer and Acrylic Paint on Board" data-src="images/artwork/099-feed-series.jpg"><img src="images/artwork/thumbs/099-feed-series.jpg" alt="Feed Series" width="534" height="540" loading="lazy"><span class="caption">Feed Series<small>Print Transfer and Acrylic Paint on Board</small></span></button><button type="button" data-type="image" data-title="Feed Series" data-desc="Print Transfer and Acrylic Paint on Board" data-src="images/artwork/100-feed-series.jpg"><img src="images/artwork/thumbs/100-feed-series.jpg" alt="Feed Series" width="580" height="583" loading="lazy"><span class="caption">Feed Series<small>Print Transfer and Acrylic Paint on Board</small></span></button></div><div class="feed-center"><button type="button" data-type="image" data-title="Feed" data-desc="Print Transfer and Acrylic Paint on Board&#10;&#10;Taking my two favorite musicians as my muses, I created two series, Feed and Inter@ctions, to explore the social media habits of fans as well as the interactions between fan and artist through social media posts.&#10;&#10;This is Feed. Feed visualizes the concept of the scroll: the blurring and distortion of an image that appears on your device for a mere moment, only to be swiped up and away by your absentminded thumb. If asked to recall that image, one may recall the colors or the pose of the figure, but it’s all a blur. No matter how long a user spends curating the perfect image to post, many images scattered across social media feeds everywhere will go unnoticed and forgotten a quick swipe later. Even users with thousands or millions of followers, those who have been deemed influencers, have posts that get scrolled past every day. Followers may double-tap to like or briefly enter the comment section, but posts in feeds are fleeting moments. This series captures the essence of these fleeting moments scrolling through a feed. Each panel contains a digital drawing inspired by an image posted online by either Poppy or Haley Dahl. These images became further abstracted through the image transfer process and the addition of streaks of acrylic paint. Each panel was inspired by a digital post that became transformed into a unique physical art object but still remained confined to the same square shape it would appear within on Instagram." data-src="images/artwork/022-feed.jpg"><img src="images/artwork/thumbs/022-feed.jpg" alt="Feed" width="141" height="677" loading="lazy"><span class="caption">Feed<small>Print Transfer and Acrylic Paint on Board</small></span></button></div><div class="feed-side"><button type="button" data-type="image" data-title="Feed Series" data-desc="Print Transfer and Acrylic Paint on Board" data-src="images/artwork/101-feed-series.jpg"><img src="images/artwork/thumbs/101-feed-series.jpg" alt="Feed Series" width="540" height="543" loading="lazy"><span class="caption">Feed Series<small>Print Transfer and Acrylic Paint on Board</small></span></button><button type="button" data-type="image" data-title="Feed Series" data-desc="Print Transfer and Acrylic Paint on Board" data-src="images/artwork/102-feed-series.jpg"><img src="images/artwork/thumbs/102-feed-series.jpg" alt="Feed Series" width="379" height="374" loading="lazy"><span class="caption">Feed Series<small>Print Transfer and Acrylic Paint on Board</small></span></button><button type="button" data-type="image" data-title="Feed Series" data-desc="Print Transfer and Acrylic Paint on Board" data-src="images/artwork/103-feed-series.jpg"><img src="images/artwork/thumbs/103-feed-series.jpg" alt="Feed Series" width="535" height="538" loading="lazy"><span class="caption">Feed Series<small>Print Transfer and Acrylic Paint on Board</small></span></button><button type="button" data-type="image" data-title="Feed Series" data-desc="Print Transfer and Acrylic Paint on Board" data-src="images/artwork/104-feed-series.jpg"><img src="images/artwork/thumbs/104-feed-series.jpg" alt="Feed Series" width="519" height="525" loading="lazy"><span class="caption">Feed Series<small>Print Transfer and Acrylic Paint on Board</small></span></button></div></li>
