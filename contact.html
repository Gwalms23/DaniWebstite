  <main class="contact tinted">
    <div class="wrap">
      <h1 class="page-title">CONTACT</h1>
      <form class="contact-form">
        <label><span class="sr">Name</span><input name="name" type="text" placeholder="Name" required></label>
        <label><span class="sr">Email</span><input name="email" type="email" placeholder="Email" required></label>
        <label class="full"><span class="sr">Subject</span><input name="subject" type="text" placeholder="Subject"></label>
        <label class="full"><span class="sr">Message</span><textarea name="message" placeholder="Type your message here..." required></textarea></label>
        <button type="submit">Submit</button>
        <p class="form-status" role="status"></p>
      </form>
    </div>
  </main>

  <footer class="site-footer">©2020 by Danielle Fernandez</footer>
